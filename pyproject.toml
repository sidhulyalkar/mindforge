[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindforge-neuro"
version = "0.1.0"
description = "BCI runtime and SSVEP decoder for Mindforge: The First Guardian"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
lsl = ["pylsl>=1.16"]
report = ["matplotlib>=3.8"]
demo = ["pylsl>=1.16", "matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "neuro"}

[tool.setuptools.packages.find]
where = ["neuro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
