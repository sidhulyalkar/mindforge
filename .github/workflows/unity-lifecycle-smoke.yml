name: unity-lifecycle-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'unity/**'
      - '.github/workflows/unity-lifecycle-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'unity/**'
      - '.github/workflows/unity-lifecycle-smoke.yml'

permissions:
  contents: read

jobs:
  unity-editmode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect configured Unity CI license
        id: license
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${UNITY_EMAIL:-}" && -n "${UNITY_PASSWORD:-}" && ( -n "${UNITY_LICENSE:-}" || -n "${UNITY_SERIAL:-}" ) ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity CI credentials detected; native EditMode smoke tests will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity smoke tests are SKIPPED, not passed. Configure UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL, and UNITY_PASSWORD to enable the native Unity gate."
          fi

      - name: Run Unity 2022.3.62f3 lifecycle smoke tests
        if: steps.license.outputs.available == 'true'
        id: unity_tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: unity
          unityVersion: 2022.3.62f3
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity smoke artifacts
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-lifecycle-smoke-${{ github.sha }}
          path: ${{ steps.unity_tests.outputs.artifactsPath }}
          if-no-files-found: warn

      - name: Record native-gate status
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.license.outputs.available }}" == "true" ]]; then
            echo "Unity native lifecycle gate executed for 2022.3.62f3." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Unity native lifecycle gate: SKIPPED" >> "$GITHUB_STEP_SUMMARY"
            echo "No physical/native Unity qualification is claimed by this workflow run." >> "$GITHUB_STEP_SUMMARY"
            echo "Configure UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL, and UNITY_PASSWORD to activate it." >> "$GITHUB_STEP_SUMMARY"
          fi
