name: patch-v014-low-latency-once

on:
  push:
    branches:
      - feat/v014-ssvep-low-latency-architecture
    paths:
      - tools/patch_v014_low_latency.py
      - .github/workflows/patch-v014-low-latency-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v014-ssvep-low-latency-architecture
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply V0.14 implementation
        run: python tools/patch_v014_low_latency.py

      - name: Syntax-check modified Python
        run: |
          python -m py_compile neuro/mindforge_neuro/events.py
          python -m py_compile neuro/mindforge_neuro/ssvep.py
          python -m py_compile neuro/mindforge_neuro/calibration.py
          python -m py_compile neuro/mindforge_neuro/resonance.py
          python -m py_compile neuro/mindforge_neuro/acquisition.py
          python -m py_compile tools/run_unity_calibrated_decoder.py
          python -m py_compile tests/test_v014_resonance.py
          python -m py_compile tests/test_v014_unity_epoch_contract.py

      - name: Commit implementation
        run: |
          git config user.name 'mindforge-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add contracts/neural_event.v2.schema.json \
                  neuro/mindforge_neuro/events.py \
                  neuro/mindforge_neuro/ssvep.py \
                  neuro/mindforge_neuro/calibration.py \
                  neuro/mindforge_neuro/resonance.py \
                  neuro/mindforge_neuro/__init__.py \
                  neuro/mindforge_neuro/acquisition.py \
                  tools/run_unity_calibrated_decoder.py \
                  unity/Assets/Mindforge/NeuralBridge/NeuralEvent.cs \
                  unity/Assets/Mindforge/SoulWisp/WispResonanceWindow.cs \
                  unity/Assets/Mindforge/SoulWisp/VepAuraStimulus.cs \
                  unity/Assets/Mindforge/SoulWisp/SoulWispController.cs \
                  tests/test_v014_resonance.py \
                  tests/test_v014_unity_epoch_contract.py
          git commit -m 'feat(v014): synchronize Wisp SSVEP epochs and dynamic stopping'
          git push origin HEAD:feat/v014-ssvep-low-latency-architecture
