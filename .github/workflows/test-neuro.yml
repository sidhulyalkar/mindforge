name: neuro-tests

on:
  push:
  pull_request:

jobs:
  python-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -U pip
      - run: pip install -e '.[test]'

      - name: Run pytest and capture promotion evidence
        shell: bash
        run: |
          mkdir -p experiments/reports
          set +e
          pytest --junitxml=experiments/reports/pytest.xml
          pytest_status=$?
          set -e
          if [ -f experiments/reports/pytest.xml ]; then
            python tools/mindforge_qualify.py software \
              --junit experiments/reports/pytest.xml \
              --commit "$GITHUB_SHA" \
              --output experiments/reports/software-gate.json
          fi
          exit "$pytest_status"

      - name: Validate Python demo and qualification tools
        run: |
          python -m py_compile tools/run_unity_calibrated_decoder.py
          python -m py_compile tools/mindforge_dev.py
          python -m py_compile tools/mindforge_qualify.py
          python -m py_compile tools/mindforge_encounter.py
          python -m py_compile tools/mindforge_playtest.py
          python -m py_compile tools/run_unity_gate.py
          python -m py_compile tools/phantom_control.py
          python -m py_compile tools/plot_session_report.py
          python -m py_compile tools/content_foundry.py

      - name: Validate Content Foundry contracts
        run: |
          python tools/content_foundry.py validate
          python tools/content_foundry.py plan --output experiments/reports/content-foundry-plan.json

      - name: Validate browser combat modules
        run: |
          node --check web_demo/core.js
          node --check web_demo/combat.js
          node --check web_demo/render.js
          node --check web_demo/game.js

      - name: Upload exact-head software evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mindforge-software-evidence-${{ github.sha }}
          path: |
            experiments/reports/pytest.xml
            experiments/reports/software-gate.json
            experiments/reports/content-foundry-plan.json
          if-no-files-found: warn
          retention-days: 30
