name: fix-latest-kernel-once

on:
  push:
    branches:
      - fix/latest-inactive-kernel-resolution
    paths:
      - '.github/workflows/fix-latest-kernel-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-inactive-kernel-resolution
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/patch_latest_inactive_kernel.py
      - name: Commit patch
        run: |
          git config user.name 'mindforge-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add unity/Assets/Mindforge/Editor/MindforgeDemoV11Builder.cs tests/test_latest_inactive_kernel_resolution.py
          git commit -m 'fix(editor): resolve inactive competition kernel in Latest build'
          git push origin HEAD:fix/latest-inactive-kernel-resolution
