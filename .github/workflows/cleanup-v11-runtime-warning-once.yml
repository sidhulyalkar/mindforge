name: cleanup-v11-runtime-warning-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-v11-runtime-warning-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only the dead outer V11 runtime initialization flag
        shell: python
        run: |
          from pathlib import Path

          path = Path('unity/Assets/Mindforge/Presentation/MindforgeDemoV11Runtime.cs')
          text = path.read_text(encoding='utf-8')

          outer_decl = '''    public sealed class MindforgeDemoV11Runtime : MonoBehaviour
              {
                  private MindforgeDemoV11Marker _marker;
                  private bool _initialized;
          '''
          replacement_decl = '''    public sealed class MindforgeDemoV11Runtime : MonoBehaviour
              {
                  private MindforgeDemoV11Marker _marker;
          '''

          # Indentation in the source is eight spaces inside the class. Keep the replacement
          # exact and fail if the expected structure has drifted.
          outer_decl = outer_decl.replace('              ', '        ')
          replacement_decl = replacement_decl.replace('              ', '        ')
          if text.count(outer_decl) != 1:
              raise SystemExit('expected exactly one outer MindforgeDemoV11Runtime _initialized declaration')
          text = text.replace(outer_decl, replacement_decl, 1)

          outer_assignment = '''            InitializeEchoes(guardian.transform, guardian.GetComponent<FluxMeter>());
                      _initialized = true;
                      Debug.Log(
          '''.replace('                      ', '            ')
          assignment_replacement = '''            InitializeEchoes(guardian.transform, guardian.GetComponent<FluxMeter>());
                      Debug.Log(
          '''.replace('                      ', '            ')
          if text.count(outer_assignment) != 1:
              raise SystemExit('expected exactly one dead outer _initialized assignment')
          text = text.replace(outer_assignment, assignment_replacement, 1)

          # The nested MindforgeDemoCameraV11 legitimately owns one initialization flag and
          # reads it to choose direct placement vs damping. Preserve that state.
          if text.count('private bool _initialized;') != 1:
              raise SystemExit('cleanup must preserve exactly the camera _initialized field')
          if 'if (!_initialized)' not in text or '_initialized = true;' not in text:
              raise SystemExit('camera initialization state was accidentally removed')

          path.write_text(text, encoding='utf-8')

      - name: Commit warning cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- unity/Assets/Mindforge/Presentation/MindforgeDemoV11Runtime.cs
          git config user.name "mindforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add unity/Assets/Mindforge/Presentation/MindforgeDemoV11Runtime.cs
          git commit -m "chore(unity): remove dead V11 runtime warning state"
          git push origin HEAD:main
