name: patch-v014-calibration-parity-once

on:
  push:
    branches:
      - feat/v014-ssvep-low-latency-architecture
    paths:
      - tools/patch_v014_calibration_parity.py
      - .github/workflows/patch-v014-calibration-parity-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v014-ssvep-low-latency-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply calibration parity patch
        run: python tools/patch_v014_calibration_parity.py
      - name: Harden generated cue and regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cal = Path('unity/Assets/Mindforge/Calibration/AwakeningCalibrationDirector.cs')
          text = cal.read_text(encoding='utf-8')
          old = '''            yield return RunDualTaggedTrial(stage, trialSeconds, firstSwap,
                cue + (firstSwap ? " · LOOK LEFT" : " · LOOK LEFT"));
            yield return RunNeutralSettle();
            yield return RunDualTaggedTrial(stage, trialSeconds, !firstSwap,
                cue + (!firstSwap ? " · LOOK LEFT" : " · LOOK RIGHT"));'''
          new = '''            yield return RunDualTaggedTrial(stage, trialSeconds, firstSwap, cue);
            yield return RunNeutralSettle();
            yield return RunDualTaggedTrial(stage, trialSeconds, !firstSwap, cue);'''
          if text.count(old) != 1:
              raise SystemExit('generated counterbalance cue block was not found exactly once')
          cal.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/test_v014_calibration_parity.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CAL = ROOT / "unity/Assets/Mindforge/Calibration/AwakeningCalibrationDirector.cs"
          WISP = ROOT / "unity/Assets/Mindforge/SoulWisp/SoulWispController.cs"
          RUNNER = ROOT / "tools/run_unity_calibrated_decoder.py"


          def test_calibration_uses_same_simultaneous_coded_pair_as_gameplay():
              cal = CAL.read_text(encoding="utf-8")
              wisp = WISP.read_text(encoding="utf-8")
              assert "BeginCalibrationStimuli(bool swapSides)" in wisp
              assert "sightStimulus?.BeginWindow(sharedStart, sharedFrame);" in wisp
              assert "guardStimulus?.BeginWindow(sharedStart, sharedFrame);" in wisp
              assert "_calibrationStimuliActive" in wisp
              assert "SetDisplay(true, true);" in cal
              assert "BeginCalibrationStimuli(swapSides)" in cal
              assert "WaitForEndOfFrame" in cal


          def test_calibration_counterbalances_each_semantic_target_across_screen_sides():
              cal = CAL.read_text(encoding="utf-8")
              wisp = WISP.read_text(encoding="utf-8")
              assert 'RunCounterbalancedTarget("sight"' in cal
              assert 'RunCounterbalancedTarget("guard"' in cal
              assert "firstSwap" in cal
              assert "!firstSwap" in cal
              assert "_calibrationSwapSides" in wisp
              assert "float sightSide = _calibrationSwapSides ? 1f : -1f;" in wisp
              assert "float guardSide = -sightSide;" in wisp
              assert "LOOK LEFT" not in cal
              assert "LOOK RIGHT" not in cal


          def test_python_preserves_counterbalanced_segments_without_crossing_neutral_gap():
              runner = RUNNER.read_text(encoding="utf-8")
              assert "epochs: dict[str, list[np.ndarray]]" in runner
              assert "epochs.setdefault(stage, []).append(segment)" in runner
              assert "for segment in epochs[stage]:" in runner
              assert "split_windows(" in runner
              assert "segment, cfg.window_samples, hop" in runner
          PY
      - name: Syntax check Python changes
        run: |
          python -m py_compile tools/run_unity_calibrated_decoder.py
          python -m py_compile tests/test_v014_calibration_parity.py
      - name: Commit calibration parity
        run: |
          git config user.name 'mindforge-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add unity/Assets/Mindforge/SoulWisp/SoulWispController.cs \
                  unity/Assets/Mindforge/Calibration/AwakeningCalibrationDirector.cs \
                  tools/run_unity_calibrated_decoder.py \
                  tests/test_v014_calibration_parity.py
          git commit -m 'feat(v014): calibrate on simultaneous counterbalanced Wisp tags'
          git push origin HEAD:feat/v014-ssvep-low-latency-architecture
