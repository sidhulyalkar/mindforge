name: update-menu-contracts-once

on:
  push:
    branches:
      - feat/latest-integrated-unity-menu
    paths:
      - '.github/workflows/update-menu-contracts-once.yml'

permissions:
  contents: write

jobs:
  migrate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/latest-integrated-unity-menu
          fetch-depth: 0

      - name: Update contracts to canonical Latest + Legacy menu policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_demo_v11_world_reconstruction.py'): [
                  ('def test_v11_demo_has_explicit_one_click_menu():',
                   'def test_v11_builder_one_click_menu_is_archived_as_legacy():'),
                  ('MenuItem("Mindforge/V0.11 Demo/Build + Play Presentable Demo"',
                   'MenuItem("Mindforge/Legacy/V0.11 Demo/Build + Play Presentable Demo"'),
              ],
              Path('tests/test_null_ward_visual_infrastructure_v2.py'): [
                  ('MenuItem("Mindforge/Showcase/Open Null Ward Art Binding Profile"',
                   'MenuItem("Mindforge/Legacy/Showcase/Open Null Ward Art Binding Profile"'),
              ],
              Path('tests/test_unity_showcase_vertical_slice.py'): [
                  ('def test_showcase_has_one_click_editor_build_play_path_without_faking_bci():',
                   'def test_legacy_showcase_build_path_remains_recoverable_without_faking_bci():'),
                  ('MenuItem("Mindforge/Showcase/Build + Play Combat Showcase"',
                   'MenuItem("Mindforge/Legacy/Showcase/Build + Play Combat Showcase"'),
                  ('MenuItem("Mindforge/Showcase/Build + Play Cinematic Showcase"',
                   'MenuItem("Mindforge/Legacy/Showcase/Build + Play Cinematic Showcase"'),
              ],
              Path('tests/test_latest_unity_build_menu.py'): [
                  ('assert "InstallRuntime" in source',
                   'assert "private static void Install()" in source\n    assert "WispResonanceBootstrap" in source'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit migrated regression contracts
        shell: bash
        run: |
          git config user.name 'mindforge-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add tests
          git commit -m 'test(editor): enforce Latest and Legacy menu authority'
          git push origin HEAD:feat/latest-integrated-unity-menu
